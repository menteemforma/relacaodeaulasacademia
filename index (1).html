                ]

        let blocoAberto = 1;

        // Referências do HTML
        const inputBusca = document.getElementById('input-busca');
        const btnLimpar = document.getElementById('btn-limpar');
        const containerAulas = document.getElementById('container-aulas');
        const tituloLista = document.getElementById('titulo-lista');
        const badgeAulas = document.getElementById('badge-aulas');

        // Função para abrir/fechar temporada
        window.toggleBloco = function(id) {
            blocoAberto = blocoAberto === id ? null : id;
            renderizar();
        };

        // Função que desenha o aplicativo na tela
        function renderizar() {
            const termo = inputBusca.value.toLowerCase().trim();
            containerAulas.innerHTML = ''; // Limpa a tela

            if (termo) {
                // MODO DE BUSCA
                tituloLista.textContent = "Resultados da Busca";
                badgeAulas.style.display = 'none';
                let encontrou = false;

                temporadas.forEach(temp => {
                    temp.aulas.forEach(aula => {
                        if (aula.titulo.toLowerCase().includes(termo) || aula.descricao.toLowerCase().includes(termo)) {
                            encontrou = true;
                            containerAulas.innerHTML += `
                                <a href="${aula.link}" target="_blank" class="group flex items-center gap-3 bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:shadow-md transition-all active:bg-slate-50">
                                    <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 shrink-0">
                                        <i class="fa-solid fa-play-circle"></i>
                                    </div>
                                    <div class="flex-1">
                                        <span class="text-[9px] font-bold text-indigo-500 uppercase tracking-wider mb-0.5 block">${temp.titulo}</span>
                                        <h4 class="font-bold text-slate-800 text-sm mb-0.5 leading-tight">${aula.titulo}</h4>
                                        <p class="text-[11px] text-slate-500 leading-snug">${aula.descricao}</p>
                                    </div>
                                </a>
                            `;
                        }
                    });
                });

                if (!encontrou) {
                    containerAulas.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm bg-slate-100 rounded-xl">Nenhuma aula encontrada com o termo "${termo}".</div>`;
                }
            } else {
                // MODO NORMAL (TEMPORADAS)
                tituloLista.textContent = "Aulas Disponíveis";
                badgeAulas.style.display = 'block';

                temporadas.forEach(temp => {
                    const isAberto = blocoAberto === temp.id;
                    let htmlTemporada = `
                        <div class="border rounded-2xl overflow-hidden ${temp.corBg} transition-all shadow-sm">
                            <button onclick="toggleBloco(${temp.id})" class="w-full flex items-center justify-between p-4 font-bold text-left hover:bg-white/40 transition-colors ${temp.corText}">
                                <span class="text-[13px] tracking-tight">${temp.titulo}</span>
                                <i class="fa-solid ${isAberto ? 'fa-chevron-up' : 'fa-chevron-down'} shrink-0 ml-2"></i>
                            </button>
                    `;

                    if (isAberto) {
                        htmlTemporada += `<div class="bg-white p-3 flex flex-col gap-2 border-t border-black/5">`;
                        temp.aulas.forEach(aula => {
                            htmlTemporada += `
                                <a href="${aula.link}" target="_blank" class="group flex items-center gap-3 bg-slate-50 border border-slate-100 rounded-xl p-3 hover:shadow-md transition-all active:bg-slate-100">
                                    <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 shrink-0">
                                        <i class="fa-solid fa-play-circle text-sm"></i>
                                    </div>
                                    <div class="flex-1">
                                        <h4 class="font-bold text-slate-700 text-xs mb-0.5">${aula.titulo}</h4>
                                        <p class="text-[10px] text-slate-500 leading-snug">${aula.descricao}</p>
                                    </div>
                                </a>
                            `;
                        });
                        htmlTemporada += `</div>`;
                    }
                    htmlTemporada += `</div>`;
                    containerAulas.innerHTML += htmlTemporada;
                });
            }
        }

        // Eventos da Lupa
        inputBusca.addEventListener('input', () => {
            btnLimpar.style.display = inputBusca.value ? 'flex' : 'none';
            renderizar();
        });

        btnLimpar.addEventListener('click', () => {
            inputBusca.value = '';
            btnLimpar.style.display = 'none';
            renderizar();
        });

        // Inicia o app
        renderizar();
    </script>
